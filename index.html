<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rafiur Rahman — Learner, Builder & Aspiring Researcher</title>
    <meta
      name="description"
      content="Rafiur Rahman is a CSE student learning development through vibe coding and beginning a research journey in AI, machine learning, and computer vision."
    />
    <script>
      try {
        const saved = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta name="theme-color" content="#141513" />
    <meta
      property="og:title"
      content="Rafiur Rahman — Thoughtful code. Meaningful experiences."
    />
    <meta
      property="og:description"
      content="Projects, learning, and early research interests in AI, machine learning, and computer vision."
    />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
